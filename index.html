<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#181619" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bookworm" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Bookworm</title>
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #181619;
        color: #c5c9c5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        touch-action: none;
        overscroll-behavior: none;
      }

      canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        outline: none;
      }

      #safe-area-probe {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        pointer-events: none;
        visibility: hidden;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background-color: #181619;
        color: #c5c9c5;
        padding: 24px;
        text-align: center;
      }

      #boot-splash.hidden {
        display: none;
      }

      #boot-logo {
        width: 72px;
        height: 72px;
      }

      #boot-spinner {
        width: 24px;
        height: 24px;
        border: 2.5px solid #2d4f67;
        border-top-color: #7fb4ca;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      #boot-status {
        margin: 0;
        font-size: 14px;
        color: #a6a69c;
        max-width: 340px;
        line-height: 1.45;
      }

      #boot-status.error {
        color: #e46876;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="safe-area-probe" aria-hidden="true"></div>
    <input
      id="epub-picker"
      type="file"
      accept=".epub,application/epub+zip"
      multiple
      style="display: none"
    />
    <div id="boot-splash">
      <img id="boot-logo" src="./icon.svg" alt="Bookworm" />
      <div id="boot-spinner"></div>
      <p id="boot-status">Loading Bookworm…</p>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
