[package]
name = "bookworm"
version = "0.1.0"
edition = "2024"
description = "Bookworm - Native GPUI Digital Book Library & Distraction-Free EPUB Reader"
license = "MIT"

[[bin]]
name = "bookworm"
path = "src/main.rs"

[dependencies]
bookworm-core = { path = "../core", features = ["online-metadata"] }
gpui-kit = "0.10.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
strip = true
